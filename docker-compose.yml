# Docker 預設的 log 沒有上限，會一直長到磁碟滿；每個容器最多留 5 個 10 MB 的檔案（跟同機的其他專案一致）。
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    logging: *logging
    environment:
      POSTGRES_USER: tradebot
      POSTGRES_PASSWORD: tradebot
      POSTGRES_DB: tradebot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradebot"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    logging: *logging
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://tradebot:tradebot@postgres:5432/tradebot
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    logging: *logging
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
