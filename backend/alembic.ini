# Alembic 指令列設定（只有開發時用 `uv run alembic ...` 會讀到）。
# 連線網址來自 .env 的 DATABASE_URL（見 app/migrations/env.py）；後端啟動時會自動升級，見 app/migrate.py。
[alembic]
script_location = %(here)s/app/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
